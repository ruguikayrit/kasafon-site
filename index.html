<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KasaFON — Çok yakında</title>

      name="description"

    />
    <meta name="theme-color" content="#07111c" />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..700&display=swap"
      rel="stylesheet"

  <body>
    <header class="bar">
      <img src="assets/wordmark.png" alt="KasaFON" width="150" height="28" />
      <div class="lang" role="group" aria-label="Dil">
        <button type="button" data-set-lang="tr" aria-pressed="true">TR</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <main>
      <p class="eyebrow" data-i18n="kicker">Çok yakında</p>
      <h1 data-i18n="title">KasaFON hazırlanıyor.</h1>
      <p class="lead" data-i18n="lead">

      </p>
      <p class="note" data-i18n="note">App Store ve Google Play yayınları da hazırlanıyor.</p>
    </main>

    <footer>
      <p data-i18n="rights">© 2026 KasaFON</p>
    </footer>
